<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login | M2Z Reviews CMS</title>
  <meta name="description" content="Protected login page for M2Z Reviews content management.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://example.com/admin.html">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin" data-admin-page="login">
  <header class="site-header">
    <a class="logo" href="/">M2Z Reviews</a>
    <nav class="nav">
      <a href="/">Back to site</a>
      <button class="theme-toggle" data-theme-toggle>Theme</button>
    </nav>
  </header>

  <main class="admin-login-shell">
    <section class="admin-login-card" aria-label="Admin login">
      <p class="badge">Secure Access</p>
      <h1>Sign in to Content Manager</h1>
      <p class="meta">Use your admin passcode to open the post editor and export workflow.</p>

      <label for="adminPass">Admin passcode</label>
      <input id="adminPass" type="password" placeholder="Enter passcode">

      <button id="unlockBtn" class="btn" type="button">Continue to editor</button>
      <p id="authError" class="admin-error" hidden>Incorrect passcode. Please try again.</p>
    </section>
  </main>

  <footer class="site-footer">Internal use only.</footer>
  <script src="/js/global.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
